name: Release expired claims

# Optional, free on this public repo: calls /api/cron/release-expired-claims
# every 15 minutes, because Vercel Hobby only allows daily crons. Claims are
# also released lazily by every job feed, claim and check-in, and daily by
# open-job-pool, so this only makes abandoned jobs reappear sooner when no
# scooper is browsing.
#
# Off until the repository variable ENABLE_CLAIM_RELEASE_CRON is "true".
# Needs repository secrets VERCEL_URL (e.g. https://www.scoopify.club) and
# CRON_SECRET (same value as in Vercel production).
#
# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. The weekly keepalive job re-enables this workflow
# through the API to reset that timer. If GitHub disables it anyway, it emails
# the repo admins; re-enable it under Actions > Release expired claims.
# GitHub may also start scheduled runs late or skip some under load.

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: claim-release
  cancel-in-progress: false

jobs:
  release:
    if: vars.ENABLE_CLAIM_RELEASE_CRON == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/cron/release-expired-claims
        env:
          APP_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the VERCEL_URL and CRON_SECRET repository secrets"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 \
            -X POST "${APP_URL%/}/api/cron/release-expired-claims" \
            -H "Authorization: Bearer ${CRON_SECRET}"
          echo

  keepalive:
    if: vars.ENABLE_CLAIM_RELEASE_CRON == 'true' && github.event.schedule == '17 9 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow to reset the 60-day inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/claim-release.yml/enable"
