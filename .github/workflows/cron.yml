name: Run cron job manually

# Scheduled runs come from Vercel Cron (vercel.json); see docs/cron-jobs.md.
# This workflow has no schedule on purpose: GitHub auto-disables scheduled
# workflows after 60 days without repository activity, which silently stopped
# the old schedule. Use it to run a job on demand (Actions > Run workflow).
#
# Repository secrets:
#   VERCEL_URL   production origin, e.g. https://www.scoopify.club
#   CRON_SECRET  same value as CRON_SECRET in Vercel production

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Cron route to call'
        required: true
        default: 'create-weekly-services'
        type: choice
        options:
          - create-weekly-services
          - release-expired-claims
          - open-job-pool
          - process-employee-payouts

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/${{ inputs.job }}
        env:
          APP_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ inputs.job }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the VERCEL_URL and CRON_SECRET repository secrets"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "${APP_URL%/}/api/cron/${JOB}" \
            -H "Authorization: Bearer ${CRON_SECRET}"
          echo
