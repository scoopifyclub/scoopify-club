<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Scoopify Club mark">
  <!-- Original shopping-bag + paw mark (not a Shopify trademark copy) -->
  <defs>
    <linearGradient id="bagFace" x1="12" y1="10" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#97BF6F"/>
      <stop offset="1" stop-color="#6F9A34"/>
    </linearGradient>
  </defs>
  <!-- Bag body -->
  <path
    d="M16.5 20.5c0-1.4 1.1-2.5 2.5-2.5h26c1.4 0 2.5 1.1 2.5 2.5v30c0 2.5-2 4.5-4.5 4.5h-22c-2.5 0-4.5-2-4.5-4.5v-30z"
    fill="url(#bagFace)"
  />
  <!-- Soft highlight on bag -->
  <path
    d="M19.5 21.5h12c.6 0 1 .4 1 1v24.5c0 .8-.7 1.5-1.5 1.5H21c-.8 0-1.5-.7-1.5-1.5V22.5c0-.6.4-1 1-1z"
    fill="#ffffff"
    fill-opacity="0.14"
  />
  <!-- Handle -->
  <path
    d="M24 18c0-4.4 3.6-8 8-8s8 3.6 8 8"
    stroke="#56742B"
    stroke-width="3.2"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Paw pad -->
  <ellipse cx="32" cy="40.5" rx="6.2" ry="5.2" fill="#ffffff"/>
  <!-- Toe pads -->
  <circle cx="24.8" cy="33.2" r="2.35" fill="#ffffff"/>
  <circle cx="29.2" cy="30.4" r="2.55" fill="#ffffff"/>
  <circle cx="34.8" cy="30.4" r="2.55" fill="#ffffff"/>
  <circle cx="39.2" cy="33.2" r="2.35" fill="#ffffff"/>
</svg>
